# Reglas de zap-baseline.py (-c): id <TAB> acción <TAB> comentario.  (HU-28, RNF009, OWASP A02/A05, ISO 27001 A.8.9)
# Todas las alertas de la corrida se analizaron una por una. Lo que era una mala configuración real se corrigió en
# docker/nginx/ (CSP, Permissions-Policy, COOP y cookies con Secure y SameSite). Lo de abajo se ACEPTA con su motivo;
# cualquier alerta nueva que no esté aquí sigue saliendo como aviso para revisarla. Alertas de riesgo ALTO: ninguna,
# y scripts/perf/zap.sh falla si aparece alguna.
10055	IGNORE	(CSP unsafe-inline / unsafe-eval) Limitación de Odoo 19: el cliente web (OWL) compila sus plantillas con new Function y usa scripts y estilos en línea; quitarlos rompe la aplicación. El resto de la CSP sí está cerrada (default-src, base-uri, form-action, frame-ancestors, object-src).
10010	IGNORE	(frontend_lang sin HttpOnly) Es la cookie de idioma del sitio público; el JavaScript de Odoo la lee (public_root.js) y no guarda ninguna sesión. session_id sí va con HttpOnly, Secure y SameSite=Lax.
10098	IGNORE	(Access-Control-Allow-Origin: * en /logo.png y /web/binary/company_logo) Es a propósito de Odoo: el logo de la empresa es público y se incrusta en correos y reportes de otros orígenes. No expone datos ni sesión.
90004	IGNORE	(COEP y CORP ausentes) Con Cross-Origin-Embedder-Policy o Cross-Origin-Resource-Policy estrictos se bloquean las imágenes y el logo que los correos y otros sitios cargan de este servidor y los recursos externos que Odoo incrusta. COOP sí se envía (same-origin). Riesgo bajo (Spectre), sin datos sensibles en el sitio sin sesión.
10063	WARN	(Permissions-Policy) Corregido en Nginx; se deja en WARN para detectar si alguna ruta lo pierde.
10031	IGNORE	(Informativa: atributo controlable por el usuario) Es el parámetro redirect del login. Se comprobó con redirect="><script>: Odoo lo escapa (&#34;&gt;&lt;script&gt;) y no se ejecuta. Falso positivo.
10015	IGNORE	(Informativa: Cache-control) Las páginas dinámicas salen con no-cache; los assets con hash, con un año (se verifica en scripts/verificar_despliegue.sh). robots.txt y las páginas de error no llevan datos.
10049	IGNORE	(Informativa: contenido cacheable o no) Las respuestas con datos van sin caché; los estáticos públicos (favicon, assets) sí se cachean, como corresponde.
10109	IGNORE	(Informativa: aplicación web moderna) Solo avisa de que Odoo es una SPA, por lo que la araña tradicional ve poco; no es un riesgo.
10111	IGNORE	(Informativa: petición de autenticación identificada) La araña encontró el formulario de login; ZAP lo usa solo para informar.
10112	IGNORE	(Informativa: gestión de sesión identificada) Solo informa de la cookie session_id (HttpOnly, Secure, SameSite=Lax).
