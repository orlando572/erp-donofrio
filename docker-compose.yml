# ERP D'Onofrio: Odoo 19.0 Community + PostgreSQL 16 (06 §6.5).
# Uso: cp .env.example .env && docker compose up -d && scripts/init_db.sh
# Perfiles: replica (HU-25: docker compose --profile replica up -d); proxy (HU-27: scripts/levantar_prod.sh); tools llega después.
name: erp-donofrio

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
      # Los lee init-usuario-odoo.sh (solo la primera vez que se crea el volumen)
      ODOO_DB_USER: ${ODOO_DB_USER:-odoo}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?Falta ODOO_DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/primary/init-usuario-odoo.sh:/docker-entrypoint-initdb.d/10-usuario-odoo.sh:ro
      - ./docker/postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # HU-25: pg_hba propio (permite al rol 'replicador') y límite del WAL que retiene el slot de la réplica
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_slot_wal_keep_size=1GB
    ports:
      # Solo en localhost, para DBeaver
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build: ./docker/odoo
    image: erp-donofrio/odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Variables del entrypoint oficial de la imagen de Odoo
      HOST: db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:?Falta ODOO_DB_PASSWORD en .env}
      # Las usa docker/odoo/entrypoint.sh para generar odoo.conf
      ODOO_DB: ${ODOO_DB:-donofrio}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:?Falta ODOO_ADMIN_PASSWD en .env}
      # Contraseña de prueba de los usuarios por rol de donofrio_base (la aplica el post_init_hook)
      DONOFRIO_USER_PASSWORD: ${DONOFRIO_USER_PASSWORD:-}
      # HU-27: dev = 0 workers y sin proxy; el despliegue protegido (scripts/levantar_prod.sh) usa 2 y True
      ODOO_WORKERS: ${ODOO_WORKERS:-0}
      ODOO_PROXY_MODE: ${ODOO_PROXY_MODE:-False}
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - odoo-data:/var/lib/odoo
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
      - "127.0.0.1:${ODOO_LONGPOLLING_PORT:-8072}:8072"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8069/web/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # HU-27: Nginx con TLS delante de Odoo. Perfil proxy: scripts/levantar_prod.sh
  nginx:
    profiles: ["proxy"]
    image: nginx:stable
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-8443}
    volumes:
      - ./docker/nginx/odoo.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/seguridad.conf:/etc/nginx/snippets/seguridad.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"

  # HU-25: standby en streaming (física, asíncrona), solo lectura. Perfil replica.
  db-replica:
    profiles: ["replica"]
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/entrypoint-replica.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      # Sin ':?' a propósito: solo se exige al levantar el perfil replica (lo valida el script)
      REPLICADOR_PASSWORD: ${REPLICADOR_PASSWORD:-}
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - ./docker/postgres/replica/entrypoint-replica.sh:/entrypoint-replica.sh:ro
    ports:
      # Solo lectura, en localhost, para DBeaver
      - "127.0.0.1:${REPLICA_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  pgdata:
  pgdata-replica:
  odoo-data:
