name: Historia de usuario
description: Una HU del Product Backlog (una por issue)
title: "[HU-xx] "
labels: ["tipo:historia"]
body:
  - type: input
    id: hu
    attributes:
      label: ID de la HU
      placeholder: HU-01
    validations:
      required: true
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Como ___, quiero ___, para ___.
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: puntos
    attributes:
      label: Puntos de historia (Fibonacci)
      options: ["1", "2", "3", "5", "8", "13"]
    validations:
      required: true
  - type: dropdown
    id: fase
    attributes:
      label: Fase
      options: ["F1 – Núcleo", "F2 – Extensión"]
    validations:
      required: true
  - type: input
    id: requisitos
    attributes:
      label: RF / RNF relacionados
      placeholder: RF006, RNF005
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      options:
        - label: PR aprobado por el otro integrante
        - label: CI en verde
        - label: Tests y ACL de lo nuevo
        - label: Actualización del módulo (-u) sin errores
        - label: Textos en español y criterios verificados en la UI
        - label: Capturas en docs/capturas/sprint-N/
        - label: Monday en "Hecho" con enlace al PR
        - label: Borrador de la sección del informe
