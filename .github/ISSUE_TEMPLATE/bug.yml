name: Bug
description: Defecto detectado en la Review o en pruebas
title: "[BUG] "
labels: ["tipo:bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: textarea
    id: captura
    attributes:
      label: Captura o log
      description: Arrastra la imagen o pega solo las líneas relevantes del log.
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: ["Alta (bloquea)", "Media", "Baja"]
    validations:
      required: true
  - type: input
    id: hu
    attributes:
      label: HU relacionada
      placeholder: HU-xx
