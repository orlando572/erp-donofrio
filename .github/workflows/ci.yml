name: CI

# HU-02 (06 §6.4): en cada PR y en cada push a develop/main, más una corrida semanal de regresión.
on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '0 11 * * 1'   # lunes 06:00 hora de Lima
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancelan las corridas viejas de un PR; en develop y main cada commit tiene su corrida completa
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patrones legacy de Odoo (falla si hay alguno)
        run: scripts/check_legacy.sh
      - name: Ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet ruff==0.8.4
          "$RUNNER_TEMP/venv/bin/ruff" check addons

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env (valores de desarrollo del repo)
        run: cp .env.example .env
      - name: Construir la imagen de Odoo
        run: docker compose build odoo
      - name: Instalar los módulos y correr sus tests (falla si hay ERROR, test rojo o 0 pruebas)
        run: scripts/test.sh
      - name: Registro de los contenedores (solo si falló)
        if: failure()
        run: docker compose logs --no-color --tail=200

  replica:
    name: replica
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env (valores de desarrollo del repo)
        run: cp .env.example .env
      - name: Levantar el primario y la réplica (HU-25)
        run: docker compose --profile replica up -d --wait db db-replica
      - name: Verificar la réplica en streaming (falla si alguna comprobación falla)
        run: scripts/verificar_replica.sh
      - name: Registro de los contenedores (solo si falló)
        if: failure()
        run: docker compose --profile replica logs --no-color --tail=100

  backup:
    name: backup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env (valores de desarrollo del repo)
        run: cp .env.example .env
      - name: Construir la imagen de Odoo
        run: docker compose build odoo
      - name: Crear una base mínima (módulo base)
        run: scripts/init_db.sh base
      - name: Respaldo, restauración en una BD nueva y retención (HU-26)
        run: scripts/verificar_backup.sh
      - name: Registro de los contenedores (solo si falló)
        if: failure()
        run: docker compose logs --no-color --tail=100

  proxy:
    name: proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Valor de prueba solo para el CI: el modo protegido exige 16 caracteres o más y no la contraseña de ejemplo
      ODOO_ADMIN_PASSWD: ci-clave-maestra-de-prueba-2026
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env (valores de desarrollo del repo)
        run: cp .env.example .env
      - name: Construir la imagen de Odoo (incluye auditlog de OCA)
        run: docker compose build odoo
      - name: Crear una base mínima (módulo base)
        run: scripts/init_db.sh base
      - name: Levantar Odoo detrás de Nginx con TLS (HU-27)
        run: scripts/levantar_prod.sh
      - name: Verificar TLS, cabeceras, gestor de BD, assets, websocket, configuración y bloqueo de login
        run: scripts/verificar_despliegue.sh
      - name: Registro de los contenedores (solo si falló)
        if: failure()
        run: docker compose --profile proxy logs --no-color --tail=150
