# Cabeceras de seguridad (se incluyen en el server y en cada location que define add_header,
# porque Nginx no hereda add_header cuando un location define el suyo).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HU-28 (ZAP baseline): política de contenido y de permisos del navegador. Odoo solo manda «frame-ancestors 'self'».
# Odoo 19 necesita 'unsafe-inline' y 'unsafe-eval' en script-src (OWL compila sus plantillas con new Function y el
# cliente web inyecta estilos y scripts en línea); el resto de directivas sí se cierra al propio origen.
# Odoo puede mandar además su propia CSP (p. ej. en descargas): el navegador aplica todas, gana la más estricta.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# Aísla la ventana de otros orígenes (ZAP 90004; el ERP no usa popups de terceros: sin OAuth ni pasarelas de pago)
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=()" always;
# Odoo ya manda estas dos; se ocultan las suyas para que no salgan duplicadas
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
