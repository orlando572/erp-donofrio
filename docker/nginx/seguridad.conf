# Cabeceras de seguridad (se incluyen en el server y en cada location que define add_header,
# porque Nginx no hereda add_header cuando un location define el suyo).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Odoo ya manda estas dos; se ocultan las suyas para que no salgan duplicadas
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
