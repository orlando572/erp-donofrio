# pg_hba.conf del primario (HU-25). Es el de la imagen postgres:16 más UNA línea:
# el rol 'replicador' puede pedir la copia física (replicación en streaming) con contraseña.
# Se monta en /etc/postgresql/pg_hba.conf y el compose lo activa con -c hba_file=...
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     replicador      all                     scram-sha-256
host    all             all             all                     scram-sha-256
