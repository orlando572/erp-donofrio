<text x="1200" y="656" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• Nginx y Let's Encrypt</text>
<text x="1200" y="673" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• Despliegue por SSH desde Actions</text>
<polyline fill="none" stroke="#333" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#flecha)" points="1335,565 1335,600"/>
<rect x="20" y="600" width="1130" height="130" rx="8" fill="#fff" stroke="#999" stroke-width="1.5"/>
<text x="30" y="620" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Cómo se usa</text>
<text x="30" y="639" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• Cada integrante levanta todo con: cp .env.example .env · docker compose up -d --build · scripts/init_db.sh</text>
<text x="30" y="656" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• Los puertos de Odoo y PostgreSQL solo escuchan en 127.0.0.1; Nginx publica 8080 y 8443. Perfiles opcionales: docker compose --profile replica up -d y</text>
<text x="30" y="671" text-anchor="start" font-size="12" font-weight="normal" fill="#222">  scripts/levantar_prod.sh (proxy)</text>
<text x="30" y="688" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• El CI de GitHub usa el mismo docker-compose.yml y la misma imagen fechada que las PC (RNF012)</text>
