<text x="1215" y="135" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Repositorio y Projects</text>
<text x="1215" y="154" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• Ramas main, develop y feature/HU-xx</text>
<text x="1215" y="171" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• PR con revisión cruzada</text>
<text x="1215" y="188" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• Project «Scrum ERP D'Onofrio»</text>
<rect x="1205" y="230" width="260" height="130" rx="8" fill="#e8f9ee" stroke="#1e7e34" stroke-width="1.5"/>
<text x="1215" y="250" text-anchor="start" font-size="13" font-weight="bold" fill="#222">Actions · runner ubuntu-24.04</text>
<text x="1215" y="269" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• ci.yml: jobs lint, test, replica,</text>
<text x="1215" y="284" text-anchor="start" font-size="12" font-weight="normal" fill="#222">  backup y proxy</text>
<text x="1215" y="301" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• perf.yml (manual): k6 y ZAP</text>
<text x="1215" y="318" text-anchor="start" font-size="12" font-weight="normal" fill="#222">• release.yml: imagen y zip</text>
